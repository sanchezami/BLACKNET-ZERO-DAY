<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACKNET: ZERO DAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="start-container">
                <div class="game-title">
                    <h1>BLACKNET</h1>
                    <h2>ZERO DAY</h2>
                    <p class="tagline">"Every system leaves a trace."</p>
                </div>
                <div class="start-buttons">
                    <button id="btn-new-game" class="btn-primary">NEW GAME</button>
                    <button id="btn-continue" class="btn-primary" disabled>CONTINUE</button>
                    <button id="btn-settings" class="btn-secondary">SETTINGS</button>
                </div>
            </div>
        </div>
        
        <!-- Boot Screen -->
        <div id="boot-screen" class="screen">
            <div class="boot-container">
                <div id="boot-log" class="boot-log"></div>
                <button id="btn-enter-dashboard" class="btn-primary hidden">ENTER DASHBOARD</button>
            </div>
        </div>
        
        <!-- Main Game Screen -->
        <div id="game-screen" class="screen">
            <aside id="sidebar">
                <nav id="main-nav">
                    <ul>
                        <li><a href="#" data-screen="dashboard">DASHBOARD</a></li>
                        <li><a href="#" data-screen="terminal">TERMINAL</a></li>
                        <li><a href="#" data-screen="missions">MISSIONS</a></li>
                        <li><a href="#" data-screen="network">NETWORK</a></li>
                        <li><a href="#" data-screen="forensics">FORENSICS</a></li>
                        <li><a href="#" data-screen="intelligence">INTELLIGENCE</a></li>
                        <li><a href="#" data-screen="market">MARKET</a></li>
                        <li><a href="#" data-screen="inventory">INVENTORY</a></li>
                        <li><a href="#" data-screen="skills">SKILLS</a></li>
                        <li><a href="#" data-screen="statistics">STATISTICS</a></li>
                        <li><a href="#" data-screen="settings">SETTINGS</a></li>
                    </ul>
                </nav>
            </aside>
            
            <main id="main-content">
                <!-- Dynamically rendered screens -->
                <div id="screen-dashboard" class="game-screen-content active"></div>
                <div id="screen-terminal" class="game-screen-content"></div>
                <div id="screen-missions" class="game-screen-content"></div>
                <div id="screen-network" class="game-screen-content"></div>
                <div id="screen-forensics" class="game-screen-content"></div>
                <div id="screen-intelligence" class="game-screen-content"></div>
                <div id="screen-market" class="game-screen-content"></div>
                <div id="screen-inventory" class="game-screen-content"></div>
                <div id="screen-skills" class="game-screen-content"></div>
                <div id="screen-statistics" class="game-screen-content"></div>
                <div id="screen-settings" class="game-screen-content"></div>
            </main>
            
            <!-- Mobile Navigation -->
            <nav id="mobile-nav">
                <a href="#" data-screen="dashboard">DASH</a>
                <a href="#" data-screen="terminal">TERM</a>
                <a href="#" data-screen="missions">MISS</a>
                <a href="#" data-screen="network">NET</a>
                <a href="#" data-screen="menu" id="mobile-more">MORE</a>
            </nav>
        </div>
        
        <!-- Modal Container -->
        <div id="modal-container" class="modal-container hidden"></div>
        
        <!-- Notification Container -->
        <div id="notification-container" class="notification-container"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
